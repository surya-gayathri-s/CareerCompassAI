<!DOCTYPE html>
<html>
<head>
    <title>Skill Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-container">
    <h1>📊 Skill Analysis</h1>
    <p>Enter your current skills</p>

    <form action="/skill-result" method="POST">
        <input
            type="text"
            name="skills"
            placeholder="Example: Python, Java, SQL"
            required
        >

        <button type="submit">
            Analyze Skills
        </button>
    </form>

</div>

</body>
</html>
