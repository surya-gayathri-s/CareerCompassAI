
<!DOCTYPE html>
<html>
<head>
    <title>Login - CareerCompass AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-container">

    <h1>🚀 CareerCompass AI</h1>
    <p>Welcome Back</p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p style="color:#00d4ff;">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form action="/login" method="POST">

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p class="signup">
        Don't have an account?
        <a href="/signup">Sign Up</a>
    </p>

</div>

</body>
</html>
